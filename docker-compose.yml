version: '3'
services:
  postgres:
    image: 'postgres'
    container_name: 'objection_postgres'
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c random_page_cost=1.0
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  mysql:
    image: 'mysql:8.4'
    container_name: 'objection_mysql'
    ports:
      - '3306:3306'
    environment:
      - 'MYSQL_ALLOW_EMPTY_PASSWORD=yes'
  mariadb10:
    image: 'mariadb:10.6'
    container_name: 'objection_mariadb10'
    ports:
      - '3307:3306'
    environment:
      - 'MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
  mariadb11:
    image: 'mariadb:11.4'
    container_name: 'objection_mariadb11'
    ports:
      - '3308:3306'
    environment:
      - 'MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
