name: release

# Publishes to npm when a version tag is pushed. Tags are made by
# `npm run release`; see RELEASING.md.

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check the tag
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the version $version in package.json."
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every release goes to `latest`, so a plain `npm install` gets the
      # newest version. Prereleases are also tagged `next`.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the prerelease as next
        if: steps.version.outputs.prerelease == 'true'
        run: npm dist-tag add "@abedmurrar/objection@${{ steps.version.outputs.version }}" next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          node scripts/changelog.js notes "${{ steps.version.outputs.version }}" > release-notes.md
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $flags
        env:
          GH_TOKEN: ${{ github.token }}
