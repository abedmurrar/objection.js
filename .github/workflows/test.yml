name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 22, 24 and 26 are the maintained LTS lines.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint and check the formatting
        run: npx biome ci

      - name: Run docker compose
        run: docker compose up -d --wait

      - name: Setup test db
        run: node setup-test-db.js

      - name: Run tests
        run: npm test

      - name: Stress graph writes on MySQL and MariaDB
        # Concurrent upsertGraph() calls must not deadlock. 5 of the 20 rounds
        # of `npm run stress:graph`, on one Node.js version.
        if: matrix.node-version == '24.x'
        run: node bench/stress-graph-writes.js --rounds 5
